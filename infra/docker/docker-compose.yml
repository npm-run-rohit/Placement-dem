# Local dependencies for BimaPlacement. `npm run db:up` from the repo root.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement
      POSTGRES_DB: placement
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U placement"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit: # see outbound mail rendered locally once MailOutboundHandler uses SMTP in dev
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
  # localstack: # uncomment to exercise MESSAGING_DRIVER=aws / STORAGE_DRIVER=s3 locally
  #   image: localstack/localstack:3
  #   ports: ["4566:4566"]
  #   environment: { SERVICES: "s3,sqs,events,scheduler,kms,secretsmanager", DEFAULT_REGION: ap-south-1 }
volumes:
  pgdata:
